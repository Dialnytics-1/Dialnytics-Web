services:
  - type: web
    name: dialnytics-marketing
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: MARKETING_BASE_URL
        value: https://dialnytics.uk
      - key: MARKETING_DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@dialnytics.co.uk
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: NOTIFICATION_EMAIL
        value: admin@dialnytics.co.uk
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: EMAIL_WORKER_ENABLED
        value: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: CHAT_WIDGET_ENABLED
        value: true
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: WHATSAPP_FROM_NUMBER
        value: "+447476629105"
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: WHATSAPP_AI_DEFAULT
        value: true
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_ALERT_TEMPLATE
        sync: false
