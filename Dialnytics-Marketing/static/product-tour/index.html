<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dialnytics Product Tour</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--cy:#22d3ee;--bl:#3b82f6;--pu:#6d55df;--grad:linear-gradient(120deg,#22d3ee,#3b82f6 50%,#8b5cf6)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#03050c;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{width:min(100vw,177.78vh);aspect-ratio:16/9;position:relative;overflow:hidden;background:#0b0f19}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
#cam{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.45,0,.2,1);will-change:transform}
#cam img.scr{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .45s ease}
#cam img.scr.on{opacity:1}
#spot{position:absolute;border:2px solid var(--cy);border-radius:12px;box-shadow:0 0 0 4000px rgba(3,6,20,.5),0 0 26px rgba(34,211,238,.7),inset 0 0 18px rgba(34,211,238,.15);opacity:0;pointer-events:none;transition:left .7s cubic-bezier(.45,0,.2,1),top .7s cubic-bezier(.45,0,.2,1),width .7s cubic-bezier(.45,0,.2,1),height .7s cubic-bezier(.45,0,.2,1),opacity .4s}
#spot.on{opacity:1}
#typed{position:absolute;display:none;align-items:center;justify-content:center;background:#141f33;color:#eef2f8;font-size:13px;letter-spacing:.3px;border-radius:7px;white-space:nowrap;overflow:hidden}
#typed.on{display:flex}
#typed:after{content:"";width:1px;height:14px;background:#eef2f8;margin-left:1px;animation:blink 1s steps(2,start) infinite}
#cur{position:absolute;left:62%;top:80%;width:24px;height:24px;margin:-3px 0 0 -4px;z-index:6;pointer-events:none;transition:left .6s cubic-bezier(.45,0,.2,1),top .6s cubic-bezier(.45,0,.2,1);transform-origin:4px 3px;transform:scale(var(--inv,1))}
#cur svg{display:block;width:24px;height:24px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));transition:transform .12s}
#cur.down svg{transform:scale(.8)}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--cy);pointer-events:none;animation:rip .6s ease-out forwards;z-index:5}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
@keyframes blink{to{opacity:0}}
/* title screens */
#title{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(700px 460px at 50% 42%,#0c2f5e,#050816 72%);transition:opacity .8s}
#title.gone{opacity:0;pointer-events:none}
#title img{width:420px;height:auto;filter:drop-shadow(0 0 34px rgba(34,211,238,.4));opacity:0}
#title h3{font-size:22px;font-weight:800;letter-spacing:10px;padding-left:10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
#title p{font-size:17px;color:#9fb0cf;opacity:0}
#title.show img{animation:pop 1.3s cubic-bezier(.2,.9,.3,1.15) both}
#title.show h3{animation:fade 1.1s .6s both}#title.show p{animation:fade 1.1s 1s both}
#title .glow{position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.18),transparent 60%);animation:breath 5s ease-in-out infinite;pointer-events:none}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes breath{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.1);opacity:1}}
/* chapter pill + caption */
#chap{position:absolute;top:18px;left:50%;transform:translateX(-50%) translateY(-8px);display:flex;align-items:center;gap:10px;padding:7px 18px 7px 7px;border-radius:30px;background:rgba(9,13,30,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);font-size:15px;font-weight:700;z-index:8;opacity:0;transition:opacity .4s,transform .4s}
#chap.on{opacity:1;transform:translateX(-50%)}
#chap em{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--grad);font-style:normal;font-size:12px;font-weight:800;color:#fff}
#chap.flash{animation:chapFlash 1s ease}
@keyframes chapFlash{0%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}100%{box-shadow:0 0 0 18px rgba(34,211,238,0)}}
#cap{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);max-width:1080px;padding:13px 28px;border-radius:14px;background:rgba(14,18,36,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 34px rgba(0,0,0,.45);font-size:21px;font-weight:600;line-height:1.35;text-align:center;z-index:8;opacity:0;transition:opacity .35s}
#cap.on{opacity:1}#cap b{color:var(--cy);font-weight:700}
#cap.swap{animation:capIn .45s ease}
@keyframes capIn{from{opacity:.2;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%)}}
#demo{position:absolute;right:14px;bottom:66px;font-size:11px;color:#8a97b4;background:rgba(9,13,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:4px 10px;z-index:8}
/* controls (outside the scaled stage so they stay a usable size) */
#ui{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:26px 12px 8px;background:linear-gradient(transparent,rgba(3,5,12,.85));transition:opacity .35s}
#ui.idle{opacity:0}
#bar{position:relative;display:flex;gap:3px;height:6px;margin-bottom:8px;cursor:pointer}
#bar>span{position:relative;height:100%;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
#bar>span i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--grad)}
#bar>span:hover{background:rgba(255,255,255,.3)}
#row{display:flex;align-items:center;gap:6px}
#row button{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(11,16,32,.8);color:#fff;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s}
#row button:hover,#row button:focus-visible{border-color:var(--cy);box-shadow:0 0 14px rgba(34,211,238,.4);outline:0}
#row button svg{width:15px;height:15px;fill:currentColor}
#time{font-size:12px;color:#c3cbe0;margin-left:6px;font-variant-numeric:tabular-nums}
#cname{flex:1;font-size:12px;color:#9aa6c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:8px}
#menu{position:absolute;right:12px;bottom:58px;width:260px;max-height:70%;overflow:auto;background:rgba(10,14,30,.96);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px;z-index:25;box-shadow:0 20px 40px rgba(0,0,0,.5)}
#menu[hidden]{display:none}
#menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8px;background:none;color:#dbe3f3;font-size:13px;text-align:left;cursor:pointer}
#menu button:hover,#menu button.on{background:rgba(34,211,238,.1);color:#fff}
#menu button em{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:11px}
#menu button.on em{background:var(--grad)}
#menu small{margin-left:auto;color:#7f8aa6}
#big{position:absolute;left:50%;top:50%;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;border:0;background:var(--grad);color:#fff;z-index:15;cursor:pointer;display:none;place-items:center;box-shadow:0 0 0 10px rgba(34,211,238,.15),0 16px 40px rgba(0,0,0,.5)}
#big svg{width:34px;height:34px;fill:#fff;margin-left:5px}
#big.on{display:grid}
@media(max-width:560px){#row button{width:30px;height:30px}#cname{display:none}#ui{padding-top:18px}}
#vpill{position:absolute;right:14px;top:14px;z-index:22;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:30px;border:1px solid rgba(34,211,238,.55);background:rgba(9,13,30,.88);color:#fff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 0 0 0 rgba(34,211,238,.5);animation:vp 2.2s ease-out infinite}
#vpill[hidden]{display:none}
#vpill svg{width:18px;height:18px;fill:var(--cy)}
#vpill:hover{background:rgba(34,211,238,.15)}
@keyframes vp{0%{box-shadow:0 0 0 0 rgba(34,211,238,.45)}70%,100%{box-shadow:0 0 0 12px rgba(34,211,238,0)}}
#row button#vo.on{border-color:var(--cy);color:var(--cy)}
#row button#vo .x{display:block}#row button#vo.on .x{display:none}
@media(max-width:560px){#vpill{font-size:11px;padding:6px 11px 6px 8px}}
@media(prefers-reduced-motion:reduce){#cam,#spot,#cur{transition-duration:.01ms!important}}
</style></head><body>
<div id="wrap">
  <div id="stage">
    <div id="cam">
      <div id="shots"></div>
      <div id="typed"></div>
      <div id="spot"></div>
      <div id="cur"><svg viewBox="0 0 24 24"><path d="M4 2l6 18 3-7 7-3z" fill="#fff" stroke="#05070f" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
    </div>
    <div id="chap"><em>1</em><span>Sign in</span></div>
    <div id="cap"></div>
    <div id="demo">Demo data</div>
    <div id="title"><div class="glow"></div><img src="/static/img/dialnytics-logo-light.png?v=3" alt="Dialnytics"><h3>SMART CLOUD DIALER</h3><p id="tsub">A complete walkthrough of the Dialnytics dialer</p></div>
  </div>
  <button id="big" type="button" aria-label="Play tour"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></button>
  <button id="vpill" type="button" hidden><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/></svg>Turn on voice-over</button>
  <div id="menu" hidden></div>
  <div id="ui">
    <div id="bar" role="slider" aria-label="Tour progress" tabindex="0"></div>
    <div id="row">
      <button id="pp" type="button" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button id="prev" type="button" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="next" type="button" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button id="rs" type="button" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button id="vo" type="button" aria-pressed="false" aria-label="Turn voice-over on" title="Voice-over (M)"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l5 6m0-6l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span id="time">0:00 / 0:00</span>
      <span id="cname"></span>
      <button id="ch" type="button" aria-label="Chapters" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
      <button id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
  </div>
</div>
<span id="stp" hidden>0 / 0</span>
<script src="/static/product-tour/tour.js?v=9" defer></script></body></html>
