<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dialnytics Product Tour</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ac:#6366f1;--cy:#22d3ee;--page:#03050c}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--page);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{width:min(100vw,177.78vh);aspect-ratio:16/9;position:relative;overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;color:#f1f5f9;background:radial-gradient(900px 420px at 50% 55%,#0d2342,transparent 70%),linear-gradient(#03050c 62%,#0b1426)}
#lap{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:640px 360px;transform:scale(.45);transition:transform 2.6s cubic-bezier(.6,0,.2,1)}
.bezel{position:absolute;inset:-26px;border-radius:30px 30px 10px 10px;background:linear-gradient(#323744,#12141b);box-shadow:inset 0 0 0 2px #444a5a,0 0 0 rgba(34,211,238,0);transition:box-shadow 1.2s}
#lap.on .bezel{box-shadow:inset 0 0 0 2px #444a5a,0 0 220px 40px rgba(34,211,238,.28)}
.cam{position:absolute;left:50%;top:-16px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#05070c;box-shadow:0 0 0 2px #262a35}
.base{position:absolute;left:-150px;top:746px;width:1580px;height:42px;background:linear-gradient(#d3d8e2,#9097a6 55%,#565b6a);border-radius:0 0 60px 60px/0 0 24px 24px}
.base:after{content:"";position:absolute;left:50%;top:0;width:260px;height:12px;margin-left:-130px;background:#7c8393;border-radius:0 0 14px 14px}
.floor{position:absolute;left:-260px;top:786px;width:1800px;height:90px;background:radial-gradient(closest-side,rgba(34,211,238,.22),transparent);}
#screen{position:absolute;inset:0;background:#000;overflow:hidden;border-radius:4px}
#zoom{position:absolute;inset:0;transition:transform 1.3s cubic-bezier(.5,0,.2,1)}
#zoom img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s}#zoom img.on{opacity:1}
#spot{position:absolute;border:3px solid var(--cy);border-radius:12px;box-shadow:0 0 0 3000px #0007,0 0 26px var(--cy);opacity:0;pointer-events:none;transition:all .7s cubic-bezier(.5,0,.2,1)}
#inp{position:absolute;left:86.8%;top:20.3%;width:7.3%;height:4.9%;background:#0e1626;border:1px solid #1e2b45;border-radius:5px;display:none;align-items:center;justify-content:center;font-size:11px;color:#f1f5f9}
#cur{position:absolute;width:26px;height:26px;left:50%;top:85%;transition:left 1s cubic-bezier(.5,0,.2,1),top 1s cubic-bezier(.5,0,.2,1);filter:drop-shadow(0 2px 3px #000a);z-index:4}
#logoscr{position:absolute;inset:0;z-index:8;background:#000;transition:background 1.2s,opacity .9s;display:flex;align-items:center;justify-content:center}
#logoscr.on{background:radial-gradient(700px 480px at 50% 45%,#0b3a6e,#050816 72%)}
#logoscr.gone{opacity:0;pointer-events:none}
#logoscr .c{display:flex;flex-direction:column;align-items:center;gap:14px}
#logoscr img,#logoscr h3{opacity:0}
#logoscr img{width:370px;height:auto;filter:drop-shadow(0 0 34px rgba(34,211,238,.45))}
#logoscr h3{font-size:30px;font-weight:800;letter-spacing:11px;padding-left:11px;background:linear-gradient(90deg,#22d3ee,#60a5fa 50%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
#logoscr.show img{animation:pop 1.5s cubic-bezier(.2,.9,.3,1.15) both}
#logoscr.show h3{animation:fade 1.4s .8s both}
@keyframes pop{from{transform:scale(.45);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#chap{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#0b1020cc;backdrop-filter:blur(10px);border:1px solid #fff3;border-radius:30px;padding:7px 18px 7px 8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px;z-index:20;opacity:0;transition:opacity .5s}
#chap em{background:var(--ac);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-style:normal;font-size:12px}
#cap{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:#2a2a36ea;border-radius:14px;padding:13px 30px;font-size:21px;font-weight:600;z-index:20;white-space:nowrap;opacity:0;transition:opacity .5s}#cap b{color:var(--cy)}
#ctl{position:fixed;right:12px;bottom:14px;display:flex;gap:8px;z-index:30;opacity:.55;transition:opacity .2s}#ctl:hover,#ctl:focus-within{opacity:1}#ctl button{width:34px;height:34px;border-radius:50%;background:#0b1020cc;color:#fff;font-size:14px;cursor:pointer;border:1px solid #fff3}#pg{position:fixed;left:0;right:0;bottom:0;height:4px;background:#ffffff22;z-index:30}#pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#6366f1);transition:width .6s}
</style></head><body>
<div id="wrap"><div id="stage">
<div id="lap"><div class="floor"></div><div class="bezel"><i class="cam"></i></div><div class="base"></div>
<div id="screen"><div id="zoom">
<img src="/static/product-tour/img/s1.jpg" alt="screen 1"><img src="/static/product-tour/img/s2.jpg" alt="screen 2"><img src="/static/product-tour/img/s3.jpg" alt="screen 3"><img src="/static/product-tour/img/s4.jpg" alt="screen 4"><img src="/static/product-tour/img/s5.jpg" alt="screen 5"><img src="/static/product-tour/img/s6.jpg" alt="screen 6"><img src="/static/product-tour/img/s7.jpg" alt="screen 7"><img src="/static/product-tour/img/s8.jpg" alt="screen 8"><img src="/static/product-tour/img/s9.jpg" alt="screen 10">
<div id="inp"></div><div id="spot"></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M3 2l6 18 3-7 7-3z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg>
</div>
<div id="logoscr"><div class="c"><img src="/static/product-tour/img/logo.png" alt="Dialnytics"><h3>SMART CLOUD DIALER</h3></div></div>
</div></div>
<div id="chap"><em>1</em><span>Sign in</span></div>
<div id="cap">Open Dialnytics in <b>any browser</b></div>
</div></div>
<div id="pg"><i></i></div><div id="ctl"><button id="pp" type="button" aria-label="Pause">⏸</button><button id="rs" type="button" aria-label="Restart">↺</button></div><span id="stp" hidden>0 / 9</span>
<script src="/static/product-tour/tour.js?v=2" defer></script></body></html>
